# @package _global_
defaults:
  - robotwin_zeva_ego_pim_4e95_3cam_384
  - _self_

# Reproduce the previous predictive addon-only recipe and initial-readout
# retrieval. New experiments should use robotwin_zeva_ego_pim_3cam_384.
foundation_mode: frozen
model:
  mot_checkpoint_mixed_attn: false
  zeva:
    memory:
      compression: uniform
      uniform_indexing: legacy_floor
    prompt:
      initialization: legacy_xavier
    adapter:
      initialization: legacy_xavier
    task_context:
      mode: static
      train_query_exclusion: leave_one_episode_out
      temperature: 0.07
      retrieval:
        input_dim: ${model.video_dit_config.hidden_dim}
    prepared_stage2:
      history_pairing: legacy_candidates
      allow_reduced_curriculum: true
